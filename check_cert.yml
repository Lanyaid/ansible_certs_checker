---
- name: Initialize the local certificate report
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Save the current date
      ansible.builtin.set_fact:
        local_today_date: "{{ ansible_facts.date_time.iso8601 }}"

    - name: Remove any previous report
      ansible.builtin.file:
        path: /tmp/result_cert.csv
        state: absent

    - name: Create the report with its header
      ansible.builtin.copy:
        dest: /tmp/result_cert.csv
        content: "Hostname;Port;Not Before;Not After;Expire Days;Subject;Serial Number\n"
        mode: "0644"

- name: Check certificates for all configured hosts
  hosts: "all:!localhost"
  become: false
  gather_facts: false
  serial: 1
  ignore_unreachable: true
  tasks:
    - name: Validate the group's port list
      ansible.builtin.assert:
        that:
          - cert_check_ports is defined
          - cert_check_ports is sequence
          - cert_check_ports is not string
          - cert_check_ports | length > 0
          - cert_check_method is defined
          - cert_check_method in ['ssh', 'openssl']
          - >-
            cert_check_method != 'ssh'
            or cert_check_server_localhost is not defined
            or cert_check_server_localhost is boolean
          - >-
            cert_check_method != 'ssh'
            or cert_check_server_localhost | default(true)
            or (
              cert_check_server_name is defined
              and cert_check_server_name | string | length > 0
            )
        fail_msg: >-
          Define cert_check_method as 'ssh' or 'openssl', provide a non-empty
          cert_check_ports list, and when SSH mode does not target localhost,
          define cert_check_server_name. cert_check_server_localhost must be a
          YAML boolean.
      delegate_to: localhost

    - name: Check each configured port
      ansible.builtin.include_role:
        name: check_cert
        tasks_from: main
        apply:
          delegate_to: localhost
      vars:
        today_date: "{{ hostvars['localhost'].local_today_date }}"
      loop: "{{ cert_check_ports }}"
      loop_control:
        loop_var: check_port
        label: "{{ check_port }}"
      ignore_errors: true
